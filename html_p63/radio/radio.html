<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вибір радіокнопкою</title>
    <link rel="stylesheet" href="radio.css">
</head>
<body>
    <main>
        <h1>Оберіть улюблений колір</h1>
        <fieldset class="radio-list">
            <legend>Кольори:</legend>
            <ul class="radio-list-options">
                <li><label class="radio-option"><input type="radio" name="color" value="red"> Червоний</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="green"> Зелений</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="blue"> Синій</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="yellow"> Жовтий</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="orange"> Помаранчевий</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="purple"> Фіолетовий</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="pink"> Рожевий</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="turquoise"> Бірюзовий</label></li>
                <li><label class="radio-option"><input type="radio" name="color" value="black"> Чорний</label></li>
            </ul>
        </fieldset>
        <p class="radio-help">
            Радіокнопки дають змогу вибрати лише один варіант із групи.
            Коли ви обираєте інший колір, попередній вибір автоматично скасовується.
            Вибраний пункт виділяється рамкою відповідного кольору.
        </p>
    </main>
</body>
</html>
