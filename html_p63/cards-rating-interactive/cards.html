<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="cards.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>Картки та макети</h1>
    <h2>Картка</h2>
    <p>
        Картка (card) - один з центральних термінів
        веб-дизайну. Широко вживається для представлення
        різноманітних сутностей: товарів, фільмів, ігор тощо.
    </p>
    <div class="card">
        <img class="card-image" src="mic.jpg" alt="mic.jpg">
       <b><div class="card-headline">микрафон</div></b>
        
        <div class="card-subhead">
            <div class="rating-stars" role="radiogroup" aria-label="Оцінити товар від 1 до 5 зірок">
                <input class="rating-input" type="radio" name="rating" id="rating-5" value="5">
                <label for="rating-5" aria-label="5 зірок">★</label>
                <input class="rating-input" type="radio" name="rating" id="rating-4" value="4" checked>
                <label for="rating-4" aria-label="4 зірки">★</label>
                <input class="rating-input" type="radio" name="rating" id="rating-3" value="3">
                <label for="rating-3" aria-label="3 зірки">★</label>
                <input class="rating-input" type="radio" name="rating" id="rating-2" value="2">
                <label for="rating-2" aria-label="2 зірки">★</label>
                <input class="rating-input" type="radio" name="rating" id="rating-1" value="1">
                <label for="rating-1" aria-label="1 зірка">★</label>
            </div>
        </div>
        <div class="card-text">
            Самий кращий вибір тільки для вас. 
            Поспішайте придбати без проводние микрафон 
        </div>
        <div class="card-footer">
            <div class="card-prices">
                <div class="card-price-discount">₴ 800</div>
                <div class="card-price-old">₴ 1000</div>
            </div>
            <div class="card-button-percent">20%</div>
            <button class="card-button"><i class="bi bi-heart"></i></button>
            <button class="card-button"><i class="bi bi-info-circle"></i></button>
        </div>
    </div>


</body>
</html>
