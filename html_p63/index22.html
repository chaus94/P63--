        h1 {
            margin: 0 0 18px;

            display: flex;
            width: min(460px, 100%);
            flex-direction: column;

            border-radius: 10px;
        }

        .a-container a {
            padding: 10px 12px;
            border-bottom: 1px solid lightgray;

            transition: background-color 150ms ease, color 150ms ease;
        }

        .a-container a:last-child {
            border-bottom: 0;
        }

        .a-container a:hover,
        .a-container a:focus-visible {
            background: #f2f6fc;
            color: #2f5e9e;
        }
